name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The box's version (see .nvmrc); upgrading it is separate work.
          node-version-file: .nvmrc
      - name: Install libpq headers (pg-native)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: yarn install --frozen-lockfile
      - run: yarn format
      - run: yarn test
